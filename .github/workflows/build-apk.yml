name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Regenerate Android brand assets
        run: npm run generate:android

      # Derive a monotonic versionCode from the Git tag (vMAJOR.MINOR.PATCH -> e.g. v1.2.3 -> 10203).
      # Android compares versionCode to decide whether an install is an update (higher = newer);
      # always bump to a NEW tag (v1.3.0, v1.3.1, …) so it never collides with an older APK.
      - name: Compute versionCode from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG="${TAG#v}"
          IFS='.' read -r MAJ MIN PAT <<< "$TAG"
          MAJ=${MAJ:-0}; MIN=${MIN:-0}; PAT=${PAT:-0}
          CODE=$((MAJ*10000 + MIN*100 + PAT))
          echo "version_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Sync Capacitor (copy web build to native)
        run: npx cap sync android

      - name: Set Android version in build.gradle
        shell: bash
        run: |
          sed -i "s/versionCode .*/versionCode ${{ steps.version.outputs.version_code }}/" android/app/build.gradle
          sed -i "s/versionName \".*/versionName \"${{ steps.version.outputs.version_name }}\"/" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoorulQuran-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
