name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Compute versionCode from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG="${TAG#v}"
          IFS='.' read -r MAJ MIN PAT <<< "$TAG"
          MAJ=${MAJ:-0}; MIN=${MIN:-0}; PAT=${PAT:-0}
          CODE=$((MAJ*10000 + MIN*100 + PAT))
          echo "version_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Set Android version in build.gradle.kts
        shell: bash
        run: |
          sed -i "s/versionCode = .*/versionCode = ${{ steps.version.outputs.version_code }}/" android/app/build.gradle.kts
          sed -i "s/versionName = .*/versionName = \"${{ steps.version.outputs.version_name }}\"/" android/app/build.gradle.kts

      - name: Build debug APK
        id: build-debug
        working-directory: android
        shell: bash
        run: set -o pipefail; ./gradlew assembleDebug --stacktrace 2>&1 | tee ../debug-build.log
        continue-on-error: true

      - name: Build release APK
        id: build-release
        if: steps.build-debug.outcome == 'success'
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "===== Release build attempt $attempt/3 ====="
            if ./gradlew assembleRelease --stacktrace 2>&1 | tee ../release-build.log; then
              echo "Release build succeeded on attempt $attempt"
              exit 0
            fi
            echo "===== Release build attempt $attempt failed, retrying ====="
            sleep 20
          done
          exit 1
        continue-on-error: true

      - name: Upload build log on failure
        if: steps.build-debug.outcome == 'failure' || steps.build-release.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            debug-build.log
            release-build.log
          if-no-files-found: error

      - name: Show debug build log on failure
        if: steps.build-debug.outcome == 'failure'
        shell: bash
        run: |
          echo "===== FULL DEBUG BUILD LOG ====="
          cat debug-build.log
          echo "===== END LOG ====="
          # Emit each log line as a separate error annotation so the full
          # error text is surfaced through the check-run annotations API.
          awk '{ printf "::error::%s%%0A", $0 }' debug-build.log
          exit 1

      - name: Show release build log on failure
        if: steps.build-release.outcome == 'failure'
        shell: bash
        run: |
          echo "===== FULL RELEASE BUILD LOG ====="
          cat release-build.log
          echo "===== END LOG ====="
          awk '{ printf "::error::%s%%0A", $0 }' release-build.log
          exit 1

      - name: Upload debug APK
        if: steps.build-debug.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NoorulQuran-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: steps.build-release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NoorulQuran-release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.build-debug.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
