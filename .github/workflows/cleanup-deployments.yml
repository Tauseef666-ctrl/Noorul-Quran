name: Clean up stale deployments

# Vercel auto-creates a "Production" GitHub deployment for every push, so the
# count grows without bound. Keep only the newest deployment plus deployments
# pinned to a release tag (the stable ones); delete everything else.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read
  deployments: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Stable deployments: those whose commit is tagged.
            const tagShas = new Set();
            for await (const tag of github.paginate.iterator(
              github.rest.git.listMatchingRefs,
              { owner, repo, ref: 'refs/tags/' },
            )) {
              tagShas.add(tag.object.sha);
            }

            // All deployments, newest first.
            const deployments = [];
            for await (const page of github.paginate.iterator(
              github.rest.repos.listDeployments,
              { owner, repo, per_page: 100 },
            )) {
              deployments.push(...page);
            }
            deployments.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            core.info(`Found ${deployments.length} deployment(s) total`);

            const keepIds = new Set();
            if (deployments.length > 0) keepIds.add(deployments[0].id); // current
            for (const d of deployments) {
              if (tagShas.has(d.sha)) keepIds.add(d.id);               // stable
            }

            let deleted = 0;
            for (const d of deployments) {
              if (keepIds.has(d.id)) continue;
              await github.rest.repos.deleteDeployment({
                owner,
                repo,
                deployment_id: d.id,
              });
              deleted++;
            }

            core.info(`Kept ${keepIds.size} deployment(s), deleted ${deleted}`);