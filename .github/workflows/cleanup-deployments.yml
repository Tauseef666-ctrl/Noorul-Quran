name: Delete stale deployments

# Deletes every "Production" GitHub deployment created by Vercel except the
# newest and those pinned to a release tag (the stable ones).
#
# NOTE: GitHub does not allow the built-in GITHUB_TOKEN to delete deployments
# (DELETE /repos/{owner}/{repo}/deployments/{id} requires repository ADMIN
# scope). So this job uses a personal/admin PAT. Put it in a repository secret
# named DELETIONS_TOKEN, then run this workflow from the Actions tab
# (workflow_dispatch).
#
# If DELETIONS_TOKEN is not configured, the job fails fast with guidance.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Validate token
        env:
          TOKEN: ${{ secrets.DELETIONS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Repository secret DELETIONS_TOKEN is not set. Create a personal access token with 'repo' (or 'repo_deployment' fine-grained) scope and save it as a repository secret, then re-run."
            exit 1
          fi

      - name: Prune stale deployments
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DELETIONS_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const tagShas = new Set();
            for await (const tag of octokit.paginate.iterator(
              octokit.rest.git.listMatchingRefs,
              { owner, repo, ref: 'refs/tags/' },
            )) {
              tagShas.add(tag.object.sha);
            }

            const deployments = [];
            for await (const page of octokit.paginate.iterator(
              octokit.rest.repos.listDeployments,
              { owner, repo, per_page: 100 },
            )) {
              deployments.push(...page);
            }
            deployments.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            core.info(`Found ${deployments.length} deployment(s) total`);

            const keepIds = new Set();
            if (deployments.length > 0) keepIds.add(deployments[0].id);
            for (const d of deployments) {
              if (tagShas.has(d.sha)) keepIds.add(d.id);
            }

            let deleted = 0;
            for (const d of deployments) {
              if (keepIds.has(d.id)) continue;
              try {
                await octokit.rest.repos.deleteDeployment({
                  owner,
                  repo,
                  deployment_id: d.id,
                });
                deleted++;
              } catch (err) {
                core.warning(`Could not delete deployment ${d.id}: ${err.message}`);
              }
            }

            core.info(`Kept ${keepIds.size} deployment(s), deleted ${deleted}`);