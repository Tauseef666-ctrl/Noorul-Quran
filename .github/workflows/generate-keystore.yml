name: Generate release keystore

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: Generate Android release keystore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (keytool)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore (idempotent)
        shell: bash
        run: |
          cd android/app
          if [ -f release.keystore ]; then
            echo "Keystore already exists -- skipping."
            exit 0
          fi
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias noorulquran \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass noorulquran-android \
            -keypass noorulquran-android \
            -dname "CN=NoorulQuran, OU=Mobile, O=NoorulQuran, L=Karachi, ST=Sindh, C=PK"
          echo "Generated android/app/release.keystore"

      - name: Commit keystore if new
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/release.keystore
          if git diff --cached --quiet; then
            echo "No keystore changes to commit."
          else
            git commit -m "chore: add persistent Android release signing keystore"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi