    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050807" />
    <title>NoorulQuran — Read. Listen. Reflect.</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "NoorulQuran",
        "url": "https://tauseef666-ctrl.github.io/Noorul-Quran/",
        "applicationCategory": "EducationalApplication",
        "description": "Read. Listen. Reflect. A peaceful digital Mushaf and modern Quran study companion.",
        "inLanguage": ["en", "ar"],
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://tauseef666-ctrl.github.io/Noorul-Quran/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script>
      // Pre-paint theme application — prevents flash of wrong theme.
      ;(function () {
        try {
          var theme = localStorage.getItem('nq:theme') || 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          var size = localStorage.getItem('nq:arabic-size')
          if (size) document.documentElement.setAttribute('data-arabic-size', size)
        } catch (e) {
          /* storage unavailable — defaults apply */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
