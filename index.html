<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="NoorulQuran" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NoorulQuran" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="canonical" href="https://tauseef666-ctrl.github.io/Noorul-Quran/" />
    <meta
      name="description"
      content="NoorulQuran — Read. Listen. Reflect. A peaceful digital Mushaf and modern Quran study companion."
    />
    <meta
      name="og:site_name"
      property="og:site_name"
      content="NoorulQuran"
    />
    <meta
      name="og:title"
      property="og:title"
      content="NoorulQuran — Read. Listen. Reflect."
    />
    <meta
      name="og:description"
      property="og:description"
      content="A peaceful digital Mushaf and modern Quran study companion — read, listen, and reflect."
    />
    <meta name="og:type" property="og:type" content="website" />
    <meta name="og:url" property="og:url" content="https://tauseef666-ctrl.github.io/Noorul-Quran/" />
    <meta name="og:image" property="og:image" content="https://tauseef666-ctrl.github.io/Noorul-Quran/icons/pwa-512.png" />
    <meta name="og:locale" property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NoorulQuran — Read. Listen. Reflect." />
    <meta name="twitter:description" content="A peaceful digital Mushaf and modern Quran study companion — read, listen, and reflect." />
    <meta name="twitter:image" content="https://tauseef666-ctrl.github.io/Noorul-Quran/icons/pwa-512.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f1e7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050807" />
    <title>NoorulQuran — Read. Listen. Reflect.</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "NoorulQuran",
        "url": "https://tauseef666-ctrl.github.io/Noorul-Quran/",
        "applicationCategory": "EducationalApplication",
        "description": "Read. Listen. Reflect. A peaceful digital Mushaf and modern Quran study companion.",
        "inLanguage": ["en", "ar"],
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://tauseef666-ctrl.github.io/Noorul-Quran/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script>
      // Pre-paint theme application — prevents flash of wrong theme.
      ;(function () {
        try {
          var theme = localStorage.getItem('nq:theme') || 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          var size = localStorage.getItem('nq:arabic-size')
          if (size) document.documentElement.setAttribute('data-arabic-size', size)
        } catch (e) {
          /* storage unavailable — defaults apply */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static app splash (replaced by React on mount) — premium, minimal:
           only the NoorulQuran logo + "Created by Tauseef Khan". -->
      <div id="app-splash" style="position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;font-family:Inter,system-ui,sans-serif;background:radial-gradient(900px 60% at 50% -8%,rgba(15,107,82,.22),transparent 62%),linear-gradient(180deg,#050807,#0a0f0d);opacity:1;transition:opacity 0.4s ease;">
        <div style="width:76px;height:76px;display:flex;align-items:center;justify-content:center;border-radius:24px;background:rgba(0,0,0,.4);box-shadow:0 0 60px rgba(15,107,82,.35);border:1px solid rgba(255,255,255,.06);overflow:hidden;">
          <img src="/icons/pwa-192.png" width="76" height="76" alt="" role="presentation" style="display:block;width:76px;height:76px;object-fit:contain;" draggable="false" />
        </div>
        <div style="text-align:center;">
          <p style="margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;color:#fff;">Noorul<span style="color:#eec98c;">Quran</span></p>
          <p style="margin:6px 0 0;font-size:11px;letter-spacing:.4em;text-transform:none;color:rgba(255,255,255,.3);">Created by Tauseef Khan</p>
        </div>
      </div>
    </div>
    <!-- Theme crossfade overlay — fades out to mask dark↔light switch -->
    <div id="theme-crossfade" aria-hidden="true" style="position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:0;transition:opacity 0.35s ease;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
