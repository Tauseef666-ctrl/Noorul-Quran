<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="NoorulQuran" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NoorulQuran" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NoorulQuran — Read. Listen. Reflect. A peaceful digital Mushaf and modern Quran study companion."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f1e7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050807" />
    <title>NoorulQuran — Read. Listen. Reflect.</title>
    <script>
      // Pre-paint theme application — prevents flash of wrong theme.
      ;(function () {
        try {
          var theme = localStorage.getItem('nq:theme') || 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          var size = localStorage.getItem('nq:arabic-size')
          if (size) document.documentElement.setAttribute('data-arabic-size', size)
        } catch (e) {
          /* storage unavailable — defaults apply */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
