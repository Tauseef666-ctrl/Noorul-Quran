    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="NoorulQuran" />

    />

    />

      name="og:title"
      property="og:title"
      content="NoorulQuran — Read. Listen. Reflect."
    />
    <meta
      name="og:description"
      property="og:description"
      content="A peaceful digital Mushaf and modern Quran study companion — read, listen, and reflect."
    />
    <meta name="og:type" property="og:type" content="website" />
    <meta name="og:url" property="og:url" content="https://tauseef666-ctrl.github.io/Noorul-Quran/" />
    <meta name="og:image" property="og:image" content="https://tauseef666-ctrl.github.io/Noorul-Quran/icons/pwa-512.png" />
    <meta name="og:locale" property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="A peaceful digital Mushaf and modern Quran study companion — read, listen, and reflect." />
    <meta name="twitter:image" content="https://tauseef666-ctrl.github.io/Noorul-Quran/icons/pwa-512.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f1e7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050807" />
    <title>NoorulQuran — Read. Listen. Reflect.</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "NoorulQuran",
        "url": "https://tauseef666-ctrl.github.io/Noorul-Quran/",
        "applicationCategory": "EducationalApplication",
        "description": "Read. Listen. Reflect. A peaceful digital Mushaf and modern Quran study companion.",
        "inLanguage": ["en", "ar"],
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://tauseef666-ctrl.github.io/Noorul-Quran/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script>
      // Pre-paint theme application — prevents flash of wrong theme.
      ;(function () {
        try {
          var theme = localStorage.getItem('nq:theme') || 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          var size = localStorage.getItem('nq:arabic-size')
          if (size) document.documentElement.setAttribute('data-arabic-size', size)
        } catch (e) {
          /* storage unavailable — defaults apply */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static app splash (replaced by React on mount) — premium, minimal:
           only the NoorulQuran logo + "Created by Tauseef Khan". -->
      <div id="app-splash" style="position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;font-family:Inter,system-ui,sans-serif;background:radial-gradient(900px 60% at 50% -8%,rgba(15,107,82,.22),transparent 62%),linear-gradient(180deg,#050807,#0a0f0d);">
        <div style="width:72px;height:72px;display:flex;align-items:center;justify-content:center;border-radius:24px;background:rgba(0,0,0,.4);box-shadow:0 0 60px rgba(15,107,82,.35);border:1px solid rgba(255,255,255,.06);">
          <svg viewBox="0 0 64 64" width="56" height="56" role="img" aria-label="NoorulQuran logo">
            <defs>
              <linearGradient id="sp-em" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f6b52"/><stop offset="1" stop-color="#06211b"/></linearGradient>
              <linearGradient id="sp-gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eec98c"/><stop offset="1" stop-color="#c7a23a"/></linearGradient>
            </defs>
            <path d="M32 4 56 18v28L32 60 8 46V18Z" fill="url(#sp-em)" stroke="url(#sp-gd)" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M32 11 50.6 22v20L32 53 13.4 42V22Z" fill="none" stroke="url(#sp-gd)" stroke-width="0.9" stroke-opacity="0.65" stroke-linejoin="round"/>
            <path d="M37.5 16.5a8.5 8.5 0 1 0 0 17 7.2 7.2 0 1 1 0-17Z" transform="rotate(24 37 25)" fill="url(#sp-gd)"/>
            <circle cx="37" cy="38.4" r="1.7" fill="url(#sp-gd)"/>
            <g stroke="url(#sp-gd)" stroke-width="1.5" stroke-linecap="round" fill="none">
              <path d="M26 34c-3 1.6-6.6 2.3-10 2 2.6 4.6 6.2 7 10 7.4 3.8-.4 7.4-2.8 10-7.4-3.4.3-7-.4-10-2Z"/>
              <path d="M38 34c3 1.6 6.6 2.3 10 2-2.6 4.6-6.2 7-10 7.4-3.8-.4-7.4-2.8-10-7.4 3.4.3 7-.4 10-2Z"/>
            </g>
          </svg>
        </div>
        <div style="text-align:center;">
          <p style="margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;color:#fff;">Noorul<span style="color:#eec98c;">Quran</span></p>
          <p style="margin:6px 0 0;font-size:11px;letter-spacing:.4em;text-transform:none;color:rgba(255,255,255,.3);">Created by Tauseef Khan</p>
        </div>
      </div>
    </div>
    <!-- Theme crossfade overlay — fades out to mask dark↔light switch -->
    <div id="theme-crossfade" aria-hidden="true" style="position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:0;transition:opacity 0.35s ease;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
